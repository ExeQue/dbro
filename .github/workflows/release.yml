name: Release

on:
  push:
    tags: ["v*"]
  # a change to this workflow builds and smoke-tests everything before the next tag relies on it
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Ubuntu with webkit2gtk-4.1, so the binary runs on glibc 2.35 and newer
          - target: linux-amd64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: macos-universal
            runner: macos-15
          - target: windows-amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags for the version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10 # a stalled mirror fails fast instead of hanging the job
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
      - name: Build
        run: |
          flags="-s -w -X main.version=$(git describe --tags --always)"
          case "${{ runner.os }}" in
            Linux)   wails build -tags webkit2_41 -trimpath -ldflags "$flags" ;;
            macOS)   wails build -platform darwin/universal -trimpath -ldflags "$flags" ;;
            Windows) wails build -platform windows/amd64 -trimpath -ldflags "$flags" ;;
          esac
      - name: Package
        run: |
          name=dbro-$(git describe --tags --always)-${{ matrix.target }}
          mkdir -p dist
          case "${{ runner.os }}" in
            Linux)
              mkdir -p dist/$name
              cp build/bin/dbro dbro.desktop README.md LICENSE dist/$name/
              cp build/appicon.png dist/$name/dbro.png
              tar -C dist -czf dist/$name.tar.gz $name
              file=$name.tar.gz ;;
            macOS)
              ditto -c -k --keepParent build/bin/dbro.app dist/$name.zip
              file=$name.zip ;;
            Windows)
              7z a dist/$name.zip ./build/bin/dbro.exe README.md LICENSE
              file=$name.zip ;;
          esac
          cd dist && if command -v sha256sum >/dev/null; then sha256sum $file; else shasum -a 256 $file; fi > $file.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.zip*

  # the Linux binary must load on every distribution the README promises
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04", "debian:12", "debian:13"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-amd64
      - name: Run
        run: |
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgtk-3-0 libwebkit2gtk-4.1-0 >/dev/null
          tar -xzf dbro-*-linux-amd64.tar.gz
          ./dbro-*-linux-amd64/dbro version

  # the archives must unpack and start on the macOS and Windows versions the README promises.
  # GitHub has no Windows 10 runner; Server 2022 (build 20348) is the closest to it.
  smoke-desktop:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: macos-universal } # Apple silicon
          - { runner: macos-15-intel, target: macos-universal } # the x86_64 half of the universal binary
          - { runner: windows-2022, target: windows-amd64 }
          - { runner: windows-2025, target: windows-amd64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}
      - name: Run
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -x -k dbro-*.zip . && bin=./dbro.app/Contents/MacOS/dbro
          else
            7z x -bso0 dbro-*.zip && bin=./dbro.exe
          fi
          "$bin" version | tee version.txt
          grep -q . version.txt
          # the backend starts and serves the UI without a window
          "$bin" serve --addr 127.0.0.1:7810 & pid=$!
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:7810/ | grep -q headless.js
          kill $pid

  release:
    if: github.event_name == 'push'
    needs: [build, smoke, smoke-desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag *.tar.gz* *.zip*
