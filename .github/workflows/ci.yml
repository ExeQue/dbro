name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      # same ports and passwords as lerd, so the DBRO_TEST_LERD tests run unchanged
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: lerd
        ports: ["3307:3306"]
        options: --health-cmd "mysqladmin ping -plerd" --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: lerd
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries
        timeout-minutes: 10 # a stalled mirror fails fast instead of hanging the job
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build
        run: go build -tags webkit2_41 ./...
      - name: Vet
        run: go vet -tags webkit2_41 ./...
      - name: Test
        env:
          DBRO_TEST_LERD: "1"
        run: go test -tags webkit2_41 -race ./...

  # no database services on these runners; this only proves the app builds (Linux amd64 builds in test)
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10 # a stalled mirror fails fast instead of hanging the job
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build
        run: go build -tags webkit2_41 ./...
